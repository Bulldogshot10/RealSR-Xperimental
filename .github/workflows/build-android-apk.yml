name: Build My RealSR Android APK
# Maintained by Bulldogshot10; builds this fork's photo-focused Android APK.

on:
  push:
    branches: [master, main]
    paths:
      - "RealSR-NCNN-Android-GUI/**"
      - "RealSR-NCNN-Android-CLI/RealSR/**"
      - "RealSR-NCNN-Android-CLI/Resize/**"
      - "RealSR-NCNN-Android-CLI/CMake/**"
      - "RealSR-NCNN-Android-CLI/common/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSETS_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip
  NCNN_URL: https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan-shared.zip

jobs:
  build-apk:
    name: Build Android GUI APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Prepare Android assets directory
        run: |
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets
          mkdir -p 3rdparty/ncnn-android-vulkan-shared

      - name: Download NCNN runtime and upstream app assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$ASSETS_URL" -o assets.zip
          curl --fail --location --retry 3 --retry-delay 2 "$NCNN_URL" -o ncnn-android-vulkan-shared.zip
          unzip -q -o assets.zip -d RealSR-NCNN-Android-GUI/app/src/main
          unzip -q -o ncnn-android-vulkan-shared.zip -d 3rdparty/ncnn-android-vulkan-shared

          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          echo "Extracted asset paths:"
          find "$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets" -maxdepth 4 -type f | sort | head -120
          echo "Expected asset root:"
          ls -la "$ASSET_ROOT" || true
          test -d "$ASSET_ROOT"
          test -s "$ASSET_ROOT/realsr-ncnn"
          chmod +x "$ASSET_ROOT/realsr-ncnn"
          test -s "$ASSET_ROOT/libncnn.so"
          test -s "$ASSET_ROOT/libc++_shared.so"

          # These optional programs vary by upstream asset-pack revision.
          for runtime_file in realcugan-ncnn srmd-ncnn waifu2x-ncnn resize-ncnn; do
            if [ -s "$ASSET_ROOT/$runtime_file" ]; then
              chmod +x "$ASSET_ROOT/$runtime_file"
            fi
          done

      - name: Download and select complete Real-ESRGAN model pack
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          MODEL_ARCHIVE="$RUNNER_TEMP/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          MODEL_EXTRACT="$RUNNER_TEMP/realesrgan-ncnn-vulkan"

          # Keep photo models in the photo list; AnimeVideo-v3 is packaged separately.
          rm -rf "$ASSET_ROOT/models-Real-ESRGAN-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv2-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv3-anime"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip" \
            -o "$MODEL_ARCHIVE"
          mkdir -p "$MODEL_EXTRACT"
          unzip -q -o "$MODEL_ARCHIVE" -d "$MODEL_EXTRACT"

          find_model_file() {
            local filename="$1"
            local found
            found="$(find "$MODEL_EXTRACT" -type f -name "$filename" -print -quit)"
            if [ -z "$found" ]; then
              echo "Missing model file in official NCNN release: $filename" >&2
              find "$MODEL_EXTRACT" -maxdepth 4 -type f | sort | head -120 >&2
              exit 1
            fi
            printf '%s' "$found"
          }

          # Official RealESRGAN x4plus weights.
          mkdir -p "$ASSET_ROOT/models-Real-ESRGAN"
          cp "$(find_model_file realesrgan-x4plus.bin)" "$ASSET_ROOT/models-Real-ESRGAN/x4.bin"
          cp "$(find_model_file realesrgan-x4plus.param)" "$ASSET_ROOT/models-Real-ESRGAN/x4.param"

          # RealESRNet x4plus: NCNN pair converted from the upstream MSE-trained model.
          # The official Linux release ZIP does not ship this model pair.
          REALSRNET_DIR="$ASSET_ROOT/models-RealESRNet-x4plus"
          mkdir -p "$REALSRNET_DIR"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/specializeddevel/image_enhancer_fx_gui/main/models/realesrnet-x4plus.bin" \
            -o "$REALSRNET_DIR/x4.bin"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/specializeddevel/image_enhancer_fx_gui/main/models/realesrnet-x4plus.param" \
            -o "$REALSRNET_DIR/x4.param"

          # Official AnimeVideo-v3 provides native 2x, 3x and 4x NCNN weights.
          ANIME_VIDEO_DIR="$ASSET_ROOT/models-Real-ESRGAN-AnimeVideo-v3"
          mkdir -p "$ANIME_VIDEO_DIR"
          for scale in 2 3 4; do
            cp "$(find_model_file "realesr-animevideov3-x${scale}.bin")" "$ANIME_VIDEO_DIR/x${scale}.bin"
            cp "$(find_model_file "realesr-animevideov3-x${scale}.param")" "$ANIME_VIDEO_DIR/x${scale}.param"
          done

          # NCNN conversion of the official RealESRGAN_x2plus general-image weights.
          X2PLUS_DIR="$ASSET_ROOT/models-Real-ESRGAN-x2plus"
          mkdir -p "$X2PLUS_DIR"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/Hibernake/RealESRGAN_x2plus/resolve/main/realesrgan-plus-x2.bin" \
            -o "$X2PLUS_DIR/x2.bin"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/Hibernake/RealESRGAN_x2plus/resolve/main/realesrgan-plus-x2.param" \
            -o "$X2PLUS_DIR/x2.param"

          # Verify every selected model pair before packaging.
          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.bin"
          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.param"
          test -s "$X2PLUS_DIR/x2.bin"
          test -s "$X2PLUS_DIR/x2.param"
          test -s "$ASSET_ROOT/models-RealESRNet-x4plus/x4.bin"
          test -s "$ASSET_ROOT/models-RealESRNet-x4plus/x4.param"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.bin"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.param"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.bin"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.param"
          for scale in 2 3 4; do
            test -s "$ANIME_VIDEO_DIR/x${scale}.bin"
            test -s "$ANIME_VIDEO_DIR/x${scale}.param"
          done

          cat > "$ASSET_ROOT/PHOTO_MODELS.txt" <<'EOF'
          Real-ESRGAN model bundle:
          - RealESRGAN_x4plus (official NCNN release; BSD-3-Clause)
          - RealESRGAN_x2plus (NCNN conversion of official weights; BSD-3-Clause)
          - RealESRNet_x4plus (NCNN conversion of upstream MSE weights; see source repository)
          - realesr-general-x4v3 (compact general-scene model)
          - 4xNomos8kSC (Phhofm; CC BY 4.0)
          - realesr-animevideov3 x2/x3/x4 (official NCNN release; anime video)
          Sources: https://github.com/xinntao/Real-ESRGAN
                   https://huggingface.co/Hibernake/RealESRGAN_x2plus
                   https://github.com/specializeddevel/image_enhancer_fx_gui/tree/main/models
                   https://github.com/Phhofm/models/tree/main/4xNomos8kSC
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: RealSR-NCNN-Android-GUI/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install Android NDK and FFmpeg build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download OpenCV and libwebp sources for Resize CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 3rdparty
          OPENCV_ZIP="$RUNNER_TEMP/opencv-4.11.0-android-sdk.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-android-sdk.zip" \
            -o "$OPENCV_ZIP"
          echo "fab645f6b42e4f02ed43e57191cab37b00b861d13191afa34d68fc9f3d8ff763  $OPENCV_ZIP" | sha256sum --check
          unzip -q -o "$OPENCV_ZIP" -d 3rdparty
          test -f 3rdparty/OpenCV-android-sdk/sdk/native/jni/OpenCVConfig.cmake

          git clone --depth 1 --branch v1.6.0 \
            https://github.com/webmproject/libwebp.git 3rdparty/libwebp
          test -f 3rdparty/libwebp/CMakeLists.txt

          # The prebuilt NCNN shared package carries runtime libraries but not
          # all development headers required by this CLI. Generate matching
          # public headers from the same NCNN tag used for the runtime.
          git clone --depth 1 --branch 20250503 \
            https://github.com/Tencent/ncnn.git 3rdparty/ncnn-src
          cmake -S 3rdparty/ncnn-src -B "$RUNNER_TEMP/ncnn-headers-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DNCNN_VULKAN=OFF \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TESTS=OFF
          test -s "$RUNNER_TEMP/ncnn-headers-build/src/platform.h"
          test -s "$RUNNER_TEMP/ncnn-headers-build/src/ncnn_export.h"

      - name: Build fork Resize CLI with Perfect Pixel support
        shell: bash
        run: |
          set -euo pipefail
          JNI_DIR="$GITHUB_WORKSPACE/RealSR-NCNN-Android-CLI/Resize/src/main/jni"
          BUILD_DIR="$RUNNER_TEMP/resize-ncnn-android-build"
          OUTPUT_DIR="$RUNNER_TEMP/resize-ncnn-android-output"
          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          mkdir -p "$OUTPUT_DIR"

          cmake -S "$JNI_DIR" -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/3rdparty/ncnn-src/src -I$RUNNER_TEMP/ncnn-headers-build/src" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUTPUT_DIR"

          cmake --build "$BUILD_DIR" --parallel 2
          test -s "$OUTPUT_DIR/resize-ncnn"
          cp "$OUTPUT_DIR/resize-ncnn" "$ASSET_ROOT/resize-ncnn"
          chmod 755 "$ASSET_ROOT/resize-ncnn"

          echo "Built fork Resize CLI:"
          file "$ASSET_ROOT/resize-ncnn"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$ASSET_ROOT/resize-ncnn" | grep NEEDED || true

      - name: Checkout FFmpeg Android builder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Javernaut/ffmpeg-android-maker.git .ffmpeg-android-maker
          git -C .ffmpeg-android-maker checkout dd72b161ae5c759fd25a5cab971a3ff710f0bdba

      - name: Cache FFmpeg source trees
        uses: actions/cache@v4
        with:
          path: .ffmpeg-android-maker/sources
          key: ffmpeg-8.1.2-x264-arm64-ndk-r27c-${{ runner.os }}

      - name: Build FFmpeg 8.1.2 for Android arm64
        working-directory: .ffmpeg-android-maker
        shell: bash
        run: |
          set -euo pipefail
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --enable-libx264 --android-api-level=24 --source-tar=8.1.2

          FFMPEG_BUILD="$PWD/build/ffmpeg/arm64-v8a"
          test -s "$FFMPEG_BUILD/bin/ffmpeg"
          test -s "$FFMPEG_BUILD/bin/ffprobe"
          test -s "$FFMPEG_BUILD/lib/libavcodec.so"

          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          cp "$FFMPEG_BUILD/bin/ffmpeg" "$ASSET_ROOT/ffmpeg"
          cp "$FFMPEG_BUILD/bin/ffprobe" "$ASSET_ROOT/ffprobe"
          cp "$FFMPEG_BUILD/lib/"*.so "$ASSET_ROOT/"
          chmod +x "$ASSET_ROOT/ffmpeg" "$ASSET_ROOT/ffprobe"

          cat > "$ASSET_ROOT/FFMPEG-LICENSE.txt" <<'EOF'
          FFmpeg 8.1.2 built for Android arm64-v8a with --enable-gpl --enable-libx264.
          FFmpeg and the resulting executable/libraries are distributed under GPL-2.0-or-later.
          x264 is distributed under GPL-2.0-or-later.
          FFmpeg build scripts: https://github.com/Javernaut/ffmpeg-android-maker
          Corresponding source archive: FFmpeg-GPL-corresponding-source artifact in the same GitHub Actions run.
          EOF

          tar -czf "$GITHUB_WORKSPACE/ffmpeg-gpl-corresponding-source.tar.gz" \
            sources/ffmpeg sources/libx264 scripts ffmpeg-android-maker.sh LICENSE.txt

      - name: Upload FFmpeg corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-GPL-corresponding-source-${{ github.sha }}
          path: ffmpeg-gpl-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Build debug APK
        working-directory: RealSR-NCNN-Android-GUI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify debug APK output
        working-directory: RealSR-NCNN-Android-GUI
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;
          compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-Xperimental-video-photo-models-debug-${{ github.sha }}
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected APK: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/" >> "$GITHUB_STEP_SUMMARY"
