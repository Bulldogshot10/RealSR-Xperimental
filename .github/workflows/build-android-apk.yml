name: Build My RealSR Android APK
# Maintained by Bulldogshot10; builds this fork's photo-focused Android APK.

on:
  push:
    branches: [master, main]
    paths:
      - "RealSR-NCNN-Android-GUI/**"
      - "RealSR-NCNN-Android-CLI/RealSR/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSETS_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip
  NCNN_URL: https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan-shared.zip

jobs:
  build-apk:
    name: Build Android GUI APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Prepare Android assets directory
        run: |
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets
          mkdir -p 3rdparty/ncnn-android-vulkan-shared

      - name: Download NCNN runtime and upstream app assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$ASSETS_URL" -o assets.zip
          curl --fail --location --retry 3 --retry-delay 2 "$NCNN_URL" -o ncnn-android-vulkan-shared.zip
          unzip -q -o assets.zip -d RealSR-NCNN-Android-GUI/app/src/main
          unzip -q -o ncnn-android-vulkan-shared.zip -d 3rdparty/ncnn-android-vulkan-shared

          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          echo "Extracted asset paths:"
          find "$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets" -maxdepth 4 -type f | sort | head -120
          echo "Expected asset root:"
          ls -la "$ASSET_ROOT" || true
          test -d "$ASSET_ROOT"
          test -s "$ASSET_ROOT/realsr-ncnn"
          chmod +x "$ASSET_ROOT/realsr-ncnn"
          test -s "$ASSET_ROOT/libncnn.so"
          test -s "$ASSET_ROOT/libc++_shared.so"

          # These optional programs vary by upstream asset-pack revision.
          for runtime_file in realcugan-ncnn srmd-ncnn waifu2x-ncnn resize-ncnn; do
            if [ -s "$ASSET_ROOT/$runtime_file" ]; then
              chmod +x "$ASSET_ROOT/$runtime_file"
            fi
          done

      - name: Select photo-focused Real-ESRGAN models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"

          # Drop anime-specific Real-ESRGAN packs in this photo-focused APK.
          rm -rf "$ASSET_ROOT/models-Real-ESRGAN-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv2-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv3-anime"

          # General photo model plus two realistic/general NCNN model packs.
          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.bin"
          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.param"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.bin"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.param"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.bin"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.param"

          cat > "$ASSET_ROOT/PHOTO_MODELS.txt" <<'EOF'
          Photo-focused models included in this build:
          - realesr-general-x4v3 NCNN conversion: https://github.com/xinntao/Real-ESRGAN
          - 4xNomos8kSC: https://github.com/Phhofm/models/tree/main/4xNomos8kSC
            License: CC BY 4.0
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: RealSR-NCNN-Android-GUI/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install Android NDK and FFmpeg build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache FFmpeg source trees
        uses: actions/cache@v4
        with:
          path: .ffmpeg-android-maker/sources
          key: ffmpeg-8.1.2-x264-arm64-ndk-r27c-${{ runner.os }}

      - name: Build FFmpeg 8.1.2 for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Javernaut/ffmpeg-android-maker.git .ffmpeg-android-maker
          cd .ffmpeg-android-maker
          git checkout dd72b161ae5c759fd25a5cab971a3ff710f0bdba
          ./ffmpeg-android-maker.sh --target-abis=arm64-v8a --enable-libx264 --android-api-level=24 --source-tar=8.1.2

          FFMPEG_BUILD="$PWD/build/ffmpeg/arm64-v8a"
          test -s "$FFMPEG_BUILD/bin/ffmpeg"
          test -s "$FFMPEG_BUILD/bin/ffprobe"
          test -s "$FFMPEG_BUILD/lib/libavcodec.so"

          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          cp "$FFMPEG_BUILD/bin/ffmpeg" "$ASSET_ROOT/ffmpeg"
          cp "$FFMPEG_BUILD/bin/ffprobe" "$ASSET_ROOT/ffprobe"
          cp "$FFMPEG_BUILD/lib/"*.so "$ASSET_ROOT/"
          chmod +x "$ASSET_ROOT/ffmpeg" "$ASSET_ROOT/ffprobe"

          cat > "$ASSET_ROOT/FFMPEG-LICENSE.txt" <<'EOF'
          FFmpeg 8.1.2 built for Android arm64-v8a with --enable-gpl --enable-libx264.
          FFmpeg and the resulting executable/libraries are distributed under GPL-2.0-or-later.
          x264 is distributed under GPL-2.0-or-later.
          FFmpeg build scripts: https://github.com/Javernaut/ffmpeg-android-maker
          Corresponding source archive: FFmpeg-GPL-corresponding-source artifact in the same GitHub Actions run.
          EOF

          tar -czf "$GITHUB_WORKSPACE/ffmpeg-gpl-corresponding-source.tar.gz" \
            sources/ffmpeg sources/libx264 scripts ffmpeg-android-maker.sh LICENSE.txt

      - name: Upload FFmpeg corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-GPL-corresponding-source-${{ github.sha }}
          path: ffmpeg-gpl-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Build debug APK
        working-directory: RealSR-NCNN-Android-GUI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify debug APK output
        working-directory: RealSR-NCNN-Android-GUI
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;
          compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-Xperimental-video-photo-models-debug-${{ github.sha }}
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected APK: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/" >> "$GITHUB_STEP_SUMMARY"
