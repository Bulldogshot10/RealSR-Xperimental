name: Build RealSR-Xperimental Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'RealSR-NCNN-Android-GUI/**'
      - 'RealSR-NCNN-Android-CLI/RealSR/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSETS_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip
  NCNN_URL: https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan-shared.zip
  HF_MODEL_BASE: https://huggingface.co/tumuyan2/realsr-models/resolve/main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NCNN runtime and upstream assets
        run: |
          wget --https-only --tries=3 "$ASSETS_URL" -O assets.zip
          wget --https-only --tries=3 "$NCNN_URL" -O ncnn-android-vulkan-shared.zip
          mkdir -p 3rdparty/ncnn-android-vulkan-shared
          unzip -q -o assets.zip -d RealSR-NCNN-Android-GUI/app/src/main/assets
          unzip -q -o ncnn-android-vulkan-shared.zip -d 3rdparty/ncnn-android-vulkan-shared

      - name: Install photo-focused NCNN models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ROOT="$GITHUB_WORKSPACE/RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          mkdir -p "$ASSET_ROOT/models-ESRGAN-Nomos8kSC" "$ASSET_ROOT/models-RealeSR-general-v3"

          rm -rf "$ASSET_ROOT/models-Real-ESRGAN-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv2-anime" \
                 "$ASSET_ROOT/models-Real-ESRGANv3-anime"

          curl --fail --location --retry 3 --retry-delay 2 \
            "$HF_MODEL_BASE/models-ESRGAN-Nomos8kSC/x4.bin" \
            -o "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.bin"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$HF_MODEL_BASE/models-ESRGAN-Nomos8kSC/x4.param" \
            -o "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.param"

          curl --fail --location --retry 3 --retry-delay 2 \
            "$HF_MODEL_BASE/models-RealeSR-general-v3/x4.bin" \
            -o "$ASSET_ROOT/models-RealeSR-general-v3/x4.bin"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$HF_MODEL_BASE/models-RealeSR-general-v3/x4.param" \
            -o "$ASSET_ROOT/models-RealeSR-general-v3/x4.param"

          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.bin"
          test -s "$ASSET_ROOT/models-Real-ESRGAN/x4.param"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.bin"
          test -s "$ASSET_ROOT/models-ESRGAN-Nomos8kSC/x4.param"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.bin"
          test -s "$ASSET_ROOT/models-RealeSR-general-v3/x4.param"

          cat > "$ASSET_ROOT/PHOTO_MODEL_ATTRIBUTION.txt" <<'EOF'
          Photo/general models packaged in this build:
          - RealESRGAN_x4plus: Xintao Wang et al., Real-ESRGAN project.
            https://github.com/xinntao/Real-ESRGAN
          - 4xNomos8kSC: Philip Hofmann / Phhofm, CC BY 4.0.
            https://github.com/Phhofm/models/tree/main/4xNomos8kSC
          - realesr-general-x4v3 NCNN conversion from tumuyan2/realsr-models.
            Original project: https://github.com/xinntao/Real-ESRGAN
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: RealSR-NCNN-Android-GUI
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-Xperimental-photo-models-debug
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
